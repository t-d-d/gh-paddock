AWSTemplateFormatVersion: '2010-09-09'
Description: >
  gh-paddock: the listener that drives self-hosted GitHub Actions runners on
  Fargate. Stack paddock. The listener runs as one Fargate Spot service,
  healthy while GitHub answers it, and starts runner tasks in the same
  cluster, each running one job at a time.

# Applied by .github/workflows/deploy.yml on a green push to main, after the
# bootstrap stack. Every value the operator chooses is a parameter, never a
# literal here (docs/constraints/public-repo.md). The served repos are no
# parameter: the listener reads them from Parameter Store, /paddock/repos
# (docs/constraints/served-repos.md).

# The CI account is in us-east-1 (docs/constraints/region.md).
Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: gh-paddock's CI account is in us-east-1.

Parameters:
  ImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'
    Description: The listener's image, pinned by digest. The deploy builds it.

  RunnerImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'
    Description: >-
      The runner's image, pinned by digest: x64, built FROM GitHub's runner
      image. The deploy builds it on an x64 runner.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The default VPC, which the deploy reads.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      The default VPC's subnets: public, with an internet gateway and no NAT
      to pay for. The deploy reads them.

  AlertEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /paddock/alert-email
    Description: >-
      Where alarms page the operator. Read from Parameter Store, so the
      address never passes through GitHub's public run logs.

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: paddock
      # Each pool's runner tasks run on the capacity the repo list gives it,
      # Spot or on-demand. The listener runs on Spot.
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  ListenerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /paddock/listener
      RetentionInDays: 30

  # Pulls the image and writes the logs. The listener's own grants go on
  # ListenerTaskRole.
  ListenerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # What the listener itself may do: read the App key and the repo list,
  # write each runner's config, hand a running task its next one, and start
  # runner tasks. Only the listener
  # holds these (docs/constraints/runner-isolation.md).
  ListenerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: listener
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The operator writes both by hand; no stack creates either.
              - Sid: ReadTheAppKeyAndTheRepoList
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paddock/github-app'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paddock/repos'
              # One SecureString per runner, deleted once its task runs.
              - Sid: KeepRunnerConfigs
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paddock/runners/*'
              # Each runner gets a task definition of its own, naming its own
              # config. ECS takes no resource scope on these two.
              - Sid: RegisterRunnerTaskDefinitions
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                Resource: '*'
              - Sid: DeleteRunnerTaskDefinitions
                Effect: Allow
                Action: ecs:DeleteTaskDefinitions
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/paddock-runner:*'
              - Sid: StartRunnerTasks
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/paddock-runner:*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Sid: TagRunnerTasks
                Effect: Allow
                Action: ecs:TagResource
                Resource:
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/paddock-runner:*'
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/paddock/*'
              - Sid: CountRunnerTasks
                Effect: Allow
                Action: ecs:ListTasks
                Resource: '*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Sid: ReadRunnerTasks
                Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/paddock/*'
              # A running task's later configs, one object per task. The
              # listener presigns each task's GET, so the URL can do no more
              # than this role. Listing lets a GET of a config not yet
              # written answer 404 rather than 403, which the task takes as
              # refused.
              - Sid: KeepLaterRunnerConfigs
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${RunnerConfigs.Arn}/*'
              - Sid: SeeWhetherALaterConfigIsWritten
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RunnerConfigs.Arn
              - Sid: PassTheRunnersExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  # A running task's next config: one object per task, which the task
  # reads through a presigned URL that came in its first config. No role
  # but the listener's reaches the bucket
  # (docs/constraints/runner-isolation.md).
  RunnerConfigs:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # A config is deleted once its runner registers; this catches any the
      # listener lost track of, such as across a restart.
      LifecycleConfiguration:
        Rules:
          - Id: expire-configs
            Status: Enabled
            ExpirationInDays: 1

  RunnerConfigsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RunnerConfigs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt RunnerConfigs.Arn
              - !Sub '${RunnerConfigs.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  RunnerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /paddock/runners
      RetentionInDays: 30

  # Pulls the runner's image, writes its logs, and reads its config for ECS
  # to inject. A runner task holds no role of its own, so the job it runs
  # can read nothing in the account
  # (docs/constraints/runner-isolation.md).
  RunnerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: runner-config
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paddock/runners/*'

  # Outbound only: a runner calls GitHub, and nothing calls it.
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: gh-paddock runners, outbound only
      VpcId: !Ref VpcId

  ListenerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: paddock-listener
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ListenerExecutionRole.Arn
      TaskRoleArn: !GetAtt ListenerTaskRole.Arn
      ContainerDefinitions:
        - Name: listener
          Image: !Ref ImageUri
          Essential: true
          # Two minutes, Fargate Spot's notice, to close its message
          # sessions before the task is stopped.
          StopTimeout: 120
          Environment:
            # The digest alone: the image URI names the registry, which
            # carries the account id.
            - Name: PADDOCK_IMAGE_DIGEST
              Value: !Select [1, !Split ['@', !Ref ImageUri]]
            # Where and how to start runner tasks. The listener never logs
            # these, since the image URI and the role's ARN carry the
            # account id.
            - Name: PADDOCK_CLUSTER
              Value: !Ref Cluster
            - Name: PADDOCK_SUBNETS
              Value: !Join [',', !Ref SubnetIds]
            - Name: PADDOCK_RUNNER_SECURITY_GROUP
              Value: !Ref RunnerSecurityGroup
            - Name: PADDOCK_RUNNER_IMAGE
              Value: !Ref RunnerImageUri
            - Name: PADDOCK_RUNNER_EXECUTION_ROLE_ARN
              Value: !GetAtt RunnerExecutionRole.Arn
            - Name: PADDOCK_RUNNER_LOG_GROUP
              Value: !Ref RunnerLogs
            - Name: PADDOCK_CONFIG_BUCKET
              Value: !Ref RunnerConfigs
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          # Healthy while GitHub answers: the first beat follows the App's
          # check with GitHub, and each later one a poll.
          HealthCheck:
            Command: ['CMD', '/listener', '-healthcheck']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ListenerLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: listener

  # Outbound only: the listener calls GitHub and AWS, and nothing calls it.
  ListenerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: gh-paddock listener, outbound only
      VpcId: !Ref VpcId

  ListenerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: listener
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ListenerTaskDefinition
      DesiredCount: 1
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 1
      # ECS turns rebalancing across zones on by default, and refuses to
      # update a service that has it on and a maximum of 100% or less. With
      # one task there is nothing to rebalance.
      AvailabilityZoneRebalancing: DISABLED
      DeploymentConfiguration:
        # The old task stops, closing its sessions, before the new one
        # starts: GitHub allows one message session per scale set
        # (docs/constraints/deploy.md). Jobs wait in GitHub meanwhile.
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        # A new task that never turns healthy rolls the service back to the
        # last good task definition, and fails the apply, so CloudFormation
        # rolls the stack back too rather than waiting hours on it.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ListenerSecurityGroup
          Subnets: !Ref SubnetIds

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: paddock-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ECS reports the service's CPU each minute while a task runs, and nothing
  # while none does, so missing data is the listener down. Five minutes
  # covers a Spot replacement.
  ListenerDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: paddock-listener-down
      AlarmDescription: >-
        No listener task has run for five minutes. Jobs on gh-paddock's
        runners queue and nothing starts them; clearing the runner-label
        variables sends them back to GitHub's runners.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt ListenerService.Name
      Statistic: SampleCount
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt ListenerService.Name
