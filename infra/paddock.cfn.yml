AWSTemplateFormatVersion: '2010-09-09'
Description: >
  gh-paddock: the listener that drives self-hosted GitHub Actions runners on
  Fargate. Stack paddock. The listener runs as one Fargate Spot service,
  healthy while GitHub answers it, and starts runner tasks in the same
  cluster, each running one job at a time.

# Applied by .github/workflows/deploy.yml on a green push to main, after the
# bootstrap stack. Every value the operator chooses is a parameter, never a
# literal here (docs/constraints/public-repo.md). The served repos are no
# parameter: the listener reads them from Parameter Store, /paddock/repos
# (docs/constraints/served-repos.md).

# The CI account is in us-east-1 (docs/constraints/region.md).
Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: gh-paddock's CI account is in us-east-1.

Parameters:
  ImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'
    Description: The listener's image, pinned by digest. The deploy builds it.

  RunnerImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'
    Description: >-
      The runner's image, pinned by digest: an index of an x64 and an arm64
      image, built FROM GitHub's runner image. The deploy builds each on a
      runner of its architecture.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The default VPC, which the deploy reads.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      The default VPC's subnets: public, with an internet gateway and no NAT
      to pay for. The deploy reads them.

  AlertEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /paddock/alert-email
    Description: >-
      Where alarms page the operator. Read from Parameter Store, so the
      address never passes through GitHub's public run logs.

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: paddock
      # Each pool's runner tasks run on the capacity the repo list gives it,
      # Spot or on-demand. The listener runs on Spot.
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  ListenerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /paddock/listener
      RetentionInDays: 30

  # Pulls the image and writes the logs. The listener's own grants go on
  # ListenerTaskRole.
  ListenerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # What the listener itself may do: read the App key and the repo list,
  # write each runner's config, hand a running task its next one, start
  # runner tasks, stop one whose runner never took its job, and read its
  # pools' job counts back. Only the listener holds these
  # (docs/constraints/runner-isolation.md).
  ListenerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: listener
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The operator writes both by hand; no stack creates either.
              - Sid: ReadTheAppKeyAndTheRepoList
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paddock/github-app'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paddock/repos'
              # One SecureString per runner, deleted once its task runs.
              - Sid: KeepRunnerConfigs
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paddock/runners/*'
              # Each runner gets a task definition of its own, naming its own
              # config. ECS takes no resource scope on these two.
              - Sid: RegisterRunnerTaskDefinitions
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                Resource: '*'
              - Sid: DeleteRunnerTaskDefinitions
                Effect: Allow
                Action: ecs:DeleteTaskDefinitions
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/paddock-runner:*'
              - Sid: StartRunnerTasks
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/paddock-runner:*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              # Only a task whose runner never took its job, once that
              # runner's record is removed (docs/constraints/remove-then-terminate.md).
              - Sid: StopRunnerTasksThatNeverStarted
                Effect: Allow
                Action: ecs:StopTask
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/paddock/*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              # Each pool's finished and Spot-killed jobs over 30 days,
              # which no alarm can look back over. CloudWatch takes no
              # resource scope on this.
              - Sid: ReadPoolJobCounts
                Effect: Allow
                Action: cloudwatch:GetMetricData
                Resource: '*'
              - Sid: TagRunnerTasks
                Effect: Allow
                Action: ecs:TagResource
                Resource:
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/paddock-runner:*'
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/paddock/*'
              - Sid: CountRunnerTasks
                Effect: Allow
                Action: ecs:ListTasks
                Resource: '*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Sid: ReadRunnerTasks
                Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/paddock/*'
              # A running task's later configs, one object per task. The
              # listener presigns each task's GET, so the URL can do no more
              # than this role. Listing lets a GET of a config not yet
              # written answer 404 rather than 403, which the task takes as
              # refused.
              - Sid: KeepLaterRunnerConfigs
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${RunnerConfigs.Arn}/*'
              - Sid: SeeWhetherALaterConfigIsWritten
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RunnerConfigs.Arn
              - Sid: PassTheRunnersExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RunnerExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  # A running task's next config: one object per task, which the task
  # reads through a presigned URL that came in its first config. No role
  # but the listener's reaches the bucket
  # (docs/constraints/runner-isolation.md).
  RunnerConfigs:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # A config is deleted once its runner registers; this catches any the
      # listener lost track of, such as across a restart.
      LifecycleConfiguration:
        Rules:
          - Id: expire-configs
            Status: Enabled
            ExpirationInDays: 1

  RunnerConfigsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RunnerConfigs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt RunnerConfigs.Arn
              - !Sub '${RunnerConfigs.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  RunnerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /paddock/runners
      RetentionInDays: 30

  # Pulls the runner's image, writes its logs, and reads its config for ECS
  # to inject. A runner task holds no role of its own, so the job it runs
  # can read nothing in the account
  # (docs/constraints/runner-isolation.md).
  RunnerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: runner-config
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paddock/runners/*'

  # Outbound only: a runner calls GitHub, and nothing calls it.
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: gh-paddock runners, outbound only
      VpcId: !Ref VpcId

  ListenerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: paddock-listener
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ListenerExecutionRole.Arn
      TaskRoleArn: !GetAtt ListenerTaskRole.Arn
      ContainerDefinitions:
        - Name: listener
          Image: !Ref ImageUri
          Essential: true
          # Two minutes, Fargate Spot's notice, to close its message
          # sessions before the task is stopped.
          StopTimeout: 120
          Environment:
            # The digest alone: the image URI names the registry, which
            # carries the account id.
            - Name: PADDOCK_IMAGE_DIGEST
              Value: !Select [1, !Split ['@', !Ref ImageUri]]
            # Where and how to start runner tasks. The listener never logs
            # these, since the image URI and the role's ARN carry the
            # account id.
            - Name: PADDOCK_CLUSTER
              Value: !Ref Cluster
            - Name: PADDOCK_SUBNETS
              Value: !Join [',', !Ref SubnetIds]
            - Name: PADDOCK_RUNNER_SECURITY_GROUP
              Value: !Ref RunnerSecurityGroup
            - Name: PADDOCK_RUNNER_IMAGE
              Value: !Ref RunnerImageUri
            - Name: PADDOCK_RUNNER_EXECUTION_ROLE_ARN
              Value: !GetAtt RunnerExecutionRole.Arn
            - Name: PADDOCK_RUNNER_LOG_GROUP
              Value: !Ref RunnerLogs
            - Name: PADDOCK_CONFIG_BUCKET
              Value: !Ref RunnerConfigs
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          # Healthy while GitHub answers: the first beat follows the App's
          # check with GitHub, and each later one a poll.
          HealthCheck:
            Command: ['CMD', '/listener', '-healthcheck']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ListenerLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: listener

  # Outbound only: the listener calls GitHub and AWS, and nothing calls it.
  ListenerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: gh-paddock listener, outbound only
      VpcId: !Ref VpcId

  ListenerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: listener
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ListenerTaskDefinition
      DesiredCount: 1
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 1
      # ECS turns rebalancing across zones on by default, and refuses to
      # update a service that has it on and a maximum of 100% or less. With
      # one task there is nothing to rebalance.
      AvailabilityZoneRebalancing: DISABLED
      DeploymentConfiguration:
        # The old task stops, closing its sessions, before the new one
        # starts: GitHub allows one message session per scale set
        # (docs/constraints/deploy.md). Jobs wait in GitHub meanwhile.
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        # A new task that never turns healthy rolls the service back to the
        # last good task definition, and fails the apply, so CloudFormation
        # rolls the stack back too rather than waiting hours on it.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ListenerSecurityGroup
          Subnets: !Ref SubnetIds

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: paddock-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # The alarms count lines the listener logs. Each filter below makes a
  # metric of one kind of line; the messages are constants in
  # internal/runners/recover.go and cmd/listener/main.go.
  ListenerPollsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "listener polling" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: ListenerPolls
          MetricValue: '1'

  JobsWaitingFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "job waiting for a runner" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: JobsWaitingLong
          MetricValue: '1'

  FailedStartsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "failed start" && $.inARow >= 3 }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: FailedStartsInARow
          MetricValue: '1'

  TasksPastMaxJobFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "task past its pool''s maximum job time" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: TasksPastMaxJob
          MetricValue: '1'

  SpotKillRateFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "spot kills over their limit" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: SpotKillsOverLimit
          MetricValue: '1'

  RepoListUnreadableFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "repo list unreadable" || $.msg = "repo list entry not valid" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: RepoListUnreadable
          MetricValue: '1'

  # Each pool's job counts, by repo and pool. The listener reads the first
  # two back over 30 days for the Spot-kill rate.
  JobsFinishedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "job finished" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: JobsFinished
          MetricValue: '1'
          Dimensions:
            - Key: Repo
              Value: $.repo
            - Key: Pool
              Value: $.pool

  JobsKilledBySpotFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "job killed by a Spot reclaim" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: JobsKilledBySpot
          MetricValue: '1'
          Dimensions:
            - Key: Repo
              Value: $.repo
            - Key: Pool
              Value: $.pool

  JobsFinishedInWarningFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "job finished inside the warning" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: JobsFinishedInWarning
          MetricValue: '1'
          Dimensions:
            - Key: Repo
              Value: $.repo
            - Key: Pool
              Value: $.pool

  JobsReRunFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListenerLogs
      FilterPattern: '{ $.msg = "job re-run" }'
      MetricTransformations:
        - MetricNamespace: paddock
          MetricName: JobsReRun
          MetricValue: '1'
          Dimensions:
            - Key: Repo
              Value: $.repo
            - Key: Pool
              Value: $.pool

  # The listener logs a poll each minute GitHub answered it. None for five
  # minutes is a listener down, or up and not polling: no task running
  # logs nothing, so missing data counts.
  ListenerDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: paddock-listener-down
      AlarmDescription: >-
        The listener has not polled GitHub for five minutes. Jobs on
        gh-paddock's runners queue and nothing starts them; clearing the
        runner-label variables sends them back to GitHub's runners.
      Namespace: paddock
      MetricName: ListenerPolls
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  JobWaitingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: paddock-job-waiting
      AlarmDescription: >-
        A job has waited five minutes for a gh-paddock runner. The
        listener's log names the pool. Clearing the repo's runner-label
        variables sends its next jobs to GitHub's runners.
      Namespace: paddock
      MetricName: JobsWaitingLong
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  FailedStartsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: paddock-failed-starts
      AlarmDescription: >-
        Three runner tasks in a row in one pool never took their jobs. The
        listener replaces each, but something stops runners registering:
        the runner image, GitHub, or the network.
      Namespace: paddock
      MetricName: FailedStartsInARow
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  TaskPastMaxJobAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: paddock-task-past-max-job
      AlarmDescription: >-
        A runner task has run 30 minutes past its pool's maximum job time.
        The listener does not stop it; the listener's log names the task.
      Namespace: paddock
      MetricName: TasksPastMaxJob
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # The listener checks each pool's rate a little over an hour apart, so an
  # hour can pass with no line while the rate stays over: the alarm looks
  # back two hours and fires on one line, so it does not flap.
  SpotKillRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: paddock-spot-kill-rate
      AlarmDescription: >-
        Spot reclaims killed more than 1 in 200 of a pool's jobs over 30
        days. The listener's log names the pool; its capacity can move to
        on-demand in the repo list.
      Namespace: paddock
      MetricName: SpotKillsOverLimit
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # The listener reads the list every two minutes and logs each read that
  # fails, and each invalid entry, so a list still broken keeps a line in
  # every five minutes.
  RepoListUnreadableAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: paddock-repo-list-unreadable
      AlarmDescription: >-
        The listener cannot read or parse the repo list, /paddock/repos,
        or an entry in it is not valid. It keeps serving the last list it
        read, or the repo of the invalid entry as it was, until the list
        reads clean. Its log gives the error.
      Namespace: paddock
      MetricName: RepoListUnreadable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt ListenerService.Name
