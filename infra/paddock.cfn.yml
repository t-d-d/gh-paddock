AWSTemplateFormatVersion: '2010-09-09'
Description: >
  gh-paddock: the listener that drives self-hosted GitHub Actions runners on
  Fargate. Stack paddock. For now it runs the walking skeleton: the listener
  as one Fargate Spot service, healthy while its heartbeat is fresh.

# Applied by .github/workflows/deploy.yml on a green push to main, after the
# bootstrap stack. Every value the operator chooses is a parameter, never a
# literal here (docs/constraints/public-repo.md).

Parameters:
  ImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'
    Description: The listener's image, pinned by digest. The deploy builds it.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The default VPC, which the deploy reads.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      The default VPC's subnets: public, with an internet gateway and no NAT
      to pay for. The deploy reads them.

  AlertEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /paddock/alert-email
    Description: >-
      Where alarms page the operator. Read from Parameter Store, so the
      address never passes through GitHub's public run logs.

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: paddock
      # Runner tasks will run on both: Spot for test and dev, on-demand for
      # prod. The listener runs on Spot.
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  ListenerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /paddock/listener
      RetentionInDays: 30

  # Pulls the image and writes the logs. The listener's own grants go on
  # ListenerTaskRole.
  ListenerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # What the listener itself may do. The skeleton needs nothing; the
  # scale-set work adds reading the App key, starting and stopping runner
  # tasks, and writing their configs, each scoped to this stack's own.
  ListenerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ListenerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: paddock-listener
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ListenerExecutionRole.Arn
      TaskRoleArn: !GetAtt ListenerTaskRole.Arn
      ContainerDefinitions:
        - Name: listener
          Image: !Ref ImageUri
          Essential: true
          # Two minutes, Fargate Spot's notice, to close its message
          # sessions before the task is stopped.
          StopTimeout: 120
          Environment:
            # The digest alone: the image URI names the registry, which
            # carries the account id.
            - Name: PADDOCK_IMAGE_DIGEST
              Value: !Select [1, !Split ['@', !Ref ImageUri]]
          HealthCheck:
            Command: ['CMD', '/listener', '-healthcheck']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ListenerLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: listener

  # Outbound only: the listener calls GitHub and AWS, and nothing calls it.
  ListenerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: gh-paddock listener, outbound only
      VpcId: !Ref VpcId

  ListenerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: listener
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ListenerTaskDefinition
      DesiredCount: 1
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 1
      DeploymentConfiguration:
        # The old task keeps running until the new one is healthy.
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # A new task that never turns healthy rolls the service back to the
        # last good task definition, and fails the apply, so CloudFormation
        # rolls the stack back too rather than waiting hours on it.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ListenerSecurityGroup
          Subnets: !Ref SubnetIds

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: paddock-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ECS reports the service's CPU each minute while a task runs, and nothing
  # while none does, so missing data is the listener down. Five minutes
  # covers a Spot replacement.
  ListenerDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: paddock-listener-down
      AlarmDescription: >-
        No listener task has run for five minutes. Jobs on gh-paddock's
        runners queue and nothing starts them; clearing the runner-label
        variables sends them back to GitHub's runners.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt ListenerService.Name
      Statistic: SampleCount
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt ListenerService.Name
