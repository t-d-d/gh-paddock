AWSTemplateFormatVersion: '2010-09-09'
Description: >
  gh-paddock's bootstrap: GitHub's OIDC provider, the role a run on main
  assumes to deploy, and the secret the operator writes before the first
  deploy. Stack paddock-bootstrap, in the main stack's region.

# Applied once by hand as an administrator, since nothing can assume a role
# that does not exist yet. Every deploy applies it again before the main
# stack (.github/workflows/deploy.yml), naming the repo and its ids from the
# run. Copied from gh-governor's.

Parameters:
  GitHubOwner:
    Type: String
    Description: The repo's owner, by name.

  GitHubOwnerId:
    Type: String
    AllowedPattern: '^[1-9][0-9]*$'
    Description: The repo owner's numeric id, github.repository_owner_id on any run.

  GitHubRepo:
    Type: String
    Description: The repo's name, without the owner.

  GitHubRepoId:
    Type: String
    AllowedPattern: '^[1-9][0-9]*$'
    Description: The repo's numeric id, github.repository_id on any run.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # IAM checks GitHub's certificate against its own trusted roots and
      # ignores this value, but the API still requires one.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: paddock-github-deploy
      Description: Assumed by GitHub Actions on a push to main, to deploy gh-paddock
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOidcProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub names the owner and repo by id as well as by name, so
                # a later repo that takes either name cannot assume this role.
                # A job that names a GitHub environment gets another subject,
                # so the deploy job sets none.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/main'
      # The account holds gh-paddock alone. A policy scoped to it would not
      # hold: the role must create the main stack's roles and pass them to
      # ECS, and a role that can do that can make itself an administrator.
      # The trust above, the owner's merges and the gate guard it.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  # The GitHub App's key, which only the listener reads, to talk to the
  # scale-set API. It lives here, not in the main stack, so it exists before
  # the first deploy and survives deleting a failed first create of the main
  # stack. Created holding a random placeholder: CloudFormation owns the
  # secret's existence, never its contents. The operator writes it once.
  # Retained, so a template change that drops or replaces it leaves the
  # stored value in place; a failed first create deletes it, since it then
  # holds only the placeholder.
  GitHubAppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: paddock/github-app
      Description: >-
        {"appId", "privateKey"} of gh-paddock's GitHub App, written by the
        operator. The listener mints installation tokens from it.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: placeholder
        ExcludePunctuation: true

Outputs:
  DeployRoleArn:
    Description: The value of the repository secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
