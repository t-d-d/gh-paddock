# Moves each outside action's pinned commit, and the tag comment beside it,
# to the action's newest release. "/" covers .github/workflows. The glob
# covers each composite action one level under .github/actions; a deeper
# one needs its own line, and test/action-pins.test.ts says so.
# The cooldown holds back a version update until its release is 7 days
# old. A security update is not held. The deploy job runs these actions with
# an administrator role, and a week gives a compromised release time to be
# found and pulled. Each action keeps its own pull request, so there are no
# groups. Copied from gh-governor, with the listener's base images, the Go
# module and the runner image's base added on the same terms. The runner's
# base must stay within 30 days of GitHub's latest runner release
# (docs/constraints/runner-image.md), which a weekly check and a week's
# cooldown leave room for.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /cmd/listener
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /runner
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
