# The offline gate: the same `npm run gate` a contributor runs, and builds
# of the listener's image and of the runner's for each architecture. It
# holds no secret and reaches no AWS account, so it is safe to run on any
# pull request, a fork's included.
#
# It runs on pull_request, not on a branch push. Each commit on a pull
# request gets one run, and its checks are `gate` and `image` whether the
# branch is here or on a fork, so a required `gate` check meets both. A
# push trigger would add a second run beside the pull request's. A branch
# with no pull request gets no gate run; a session raises its pull request
# straight after its push.
#
# A pull request run checks out the merge of its head into its base branch,
# not the head itself, so nothing the gate runs may depend on the head's
# history. A pull request that conflicts with its base gets no run at all
# until the conflict is resolved, so its `gate` check stays pending.
#
# pull_request, never pull_request_target: a fork's run gets a read-only
# token and no secrets. This repo is public, so these jobs run on GitHub's
# free runners, never on the runners it deploys
# (docs/constraints/public-repo.md).
name: gate

on:
  pull_request:
  # main is gated by deploy.yml, which calls this before it applies, and by
  # pages.yml, which calls it before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Read the listener's Go release
        id: go
        run: |
          version=$(sed -nE 's/^FROM[[:space:]]+(--[^[:space:]]+[[:space:]]+)*[^[:space:]]*golang:([0-9]+\.[0-9]+(\.[0-9]+)?)([-@[:space:]].*)?$/\2/p' cmd/listener/Dockerfile | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::cmd/listener/Dockerfile has no FROM golang:<release> line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The Go release comes from the golang tag in cmd/listener/Dockerfile,
      # read by the step above, so the gate tests with the release the image
      # builds with. Dependabot bumps only that tag, and this follows it.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - run: npm ci --ignore-scripts
      - run: npm run gate

  # The image the deploy would build, built and thrown away: a broken
  # Dockerfile fails here, on the pull request, rather than in the deploy after
  # merge. Native arm64, as the listener runs.
  image:
    name: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the listener's image
        run: docker build --file cmd/listener/Dockerfile --tag paddock-listener:gate .
      # As ECS runs it: the image's own user, the health check inside it. The
      # listener beats only once GitHub accepts the App key, which this
      # offline job cannot give it. So it proves the entrypoint starts and
      # logs, and the health check stays red with no beat.
      - name: Start the listener, and check its health check stays red with no beat
        run: |
          if docker run --rm paddock-listener:gate -healthcheck 2>"$RUNNER_TEMP/before.err"; then
            echo "::error::the health check passed before the listener ran"
            exit 1
          fi
          grep -q "no heartbeat" "$RUNNER_TEMP/before.err"
          if docker run --rm paddock-listener:gate >"$RUNNER_TEMP/run.out" 2>&1; then
            echo "::error::the listener started with none of its settings"
            exit 1
          fi
          cat "$RUNNER_TEMP/run.out"
          grep -q '"msg":"listener started"' "$RUNNER_TEMP/run.out"

  # The runner's image, as the deploy builds it: with buildx and the deploy's
  # output options, once for each architecture, each on a GitHub runner of
  # that architecture, never under emulation. Each checks the layers the
  # deploy's options give, starts the runner far enough to print its
  # version, checks the tools the image adds are on the path and the image
  # is the architecture asked for, and starts the entrypoint.
  runner-image:
    name: runner-image (${{ matrix.arch }})
    strategy:
      # One architecture's failure does not cancel the other's answer.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
            platform: linux/amd64
            machine: x86_64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            machine: aarch64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # With buildx and the output options the deploy's image action pushes
      # with, so a mistake in them, or a buildx release that refuses one,
      # fails here and not in the deploy on main. The OCI output is written
      # to a file and pushed nowhere; the docker output loads the image for
      # the steps below. test/gate-workflow.test.ts holds the two option
      # lists equal.
      - name: Build the runner's image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --platform "$PLATFORM" --provenance=false --file runner/Dockerfile \
            --output "type=oci,dest=$RUNNER_TEMP/runner-image.tar,oci-mediatypes=true,compression=gzip,force-compression=true" \
            --output type=docker,name=paddock-runner:gate \
            runner
      # buildx could take an option and not act on it. The tarball's manifest
      # shows what the deploy's output would push: OCI media types and gzip
      # layers, the base's included, which is what soci indexes. Only the
      # index and the manifest are read, never the layers.
      - name: Check the OCI output's manifest and layers
        run: |
          set -euo pipefail
          manifest=$(tar --wildcards -xOf "$RUNNER_TEMP/runner-image.tar" '*index.json' | jq -r '.manifests[0].digest | sub("^sha256:"; "")')
          tar --wildcards -xOf "$RUNNER_TEMP/runner-image.tar" "*blobs/sha256/${manifest}" | tee "$RUNNER_TEMP/manifest.json"
          echo
          jq -e '.mediaType == "application/vnd.oci.image.manifest.v1+json" and (.layers | length > 0) and all(.layers[]; .mediaType == "application/vnd.oci.image.layer.v1.tar+gzip")' "$RUNNER_TEMP/manifest.json" > /dev/null
      - name: Start the runner, and check the tools it adds and its architecture
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          docker run --rm --entrypoint /home/runner/bin/Runner.Listener paddock-runner:gate --version
          docker run --rm --entrypoint bash --env MACHINE paddock-runner:gate -c \
            'set -e; aws --version; jq --version; zip -v >/dev/null; python3 --version; test "$(id -un)" = runner; test "$(uname -m)" = "$MACHINE"'
      # The entrypoint is written inline in the Dockerfile. With no config it
      # stops at once, which shows it landed whole and runs.
      - name: Start the entrypoint with no config
        run: |
          if docker run --rm paddock-runner:gate >"$RUNNER_TEMP/entrypoint.out" 2>&1; then
            echo "the entrypoint ran with no config"; exit 1
          fi
          cat "$RUNNER_TEMP/entrypoint.out"
          grep -q "the task was given no config" "$RUNNER_TEMP/entrypoint.out"

  # The deploy converts the runner's index into one with a SOCI index for each
  # architecture, and pushes it. This job runs the deploy's own scripts, with
  # the real soci, skopeo and crane, against a registry started for the job,
  # never ECR. The index it converts is two small images, one per
  # architecture, each FROM scratch with one layer large enough for soci to
  # index, so neither build runs anything under emulation. They are pushed
  # with gzip OCI layers and joined with imagetools, as the deploy builds and
  # joins the runner's.
  soci:
    name: soci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On the host's network, so buildx reaches the registry at localhost.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - name: Install soci and crane
        run: |
          scripts/soci/install.sh "${RUNNER_TEMP}/soci-tools"
          echo "${RUNNER_TEMP}/soci-tools" >> "$GITHUB_PATH"
      - name: Build an image for each architecture, and join them under one index
        id: fixture
        run: |
          set -euo pipefail
          ctx="${RUNNER_TEMP}/fixture"
          mkdir -p "$ctx"
          head -c 12582912 /dev/urandom > "${ctx}/layer.bin"
          printf 'FROM scratch\nCOPY layer.bin /layer.bin\n' > "${ctx}/Dockerfile"
          digests=()
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --provenance=false \
              --output "type=image,name=localhost:5000/fixture:${platform#linux/},push=true,oci-mediatypes=true,compression=gzip,force-compression=true" \
              "$ctx"
            digests+=("localhost:5000/fixture@$(crane digest "localhost:5000/fixture:${platform#linux/}")")
          done
          docker buildx imagetools create --tag localhost:5000/fixture:gzip "${digests[@]}"
          echo "digest=$(crane digest localhost:5000/fixture:gzip)" >> "$GITHUB_OUTPUT"
      - name: Convert, push and check the index as the deploy does
        env:
          DIGEST: ${{ steps.fixture.outputs.digest }}
        run: |
          set -euo pipefail
          TLS_VERIFY=false scripts/soci/convert-and-push.sh "localhost:5000/fixture@${DIGEST}" localhost:5000/fixture:soci "$RUNNER_TEMP"
          crane manifest localhost:5000/fixture:soci | tee "${RUNNER_TEMP}/index.json"
          echo
          jq -e -f scripts/soci/check-index.jq "${RUNNER_TEMP}/index.json" > /dev/null
