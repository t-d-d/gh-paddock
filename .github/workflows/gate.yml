# The offline gate: the same `npm run gate` a contributor runs, and a build
# of the listener's image. It holds no secret and reaches no AWS account, so
# it is safe to run on every push and on a fork's pull request.
#
# A branch pushed here is gated by its push run, and its pull request runs
# nothing named `gate` or `image`: a skipped job reports success, so a
# skipped pull_request run would read as a green gate while the push run's
# was still running. A fork's pull request has no push run here, so
# fork-gate.yml calls this for it, under its own job name.
#
# This repo is public, so these jobs run on GitHub's free runners, never on
# the runners it deploys (docs/constraints/public-repo.md).
name: gate

on:
  # main is gated by deploy.yml, which calls this before it applies.
  push:
    branches-ignore: [main]
  # deploy.yml, on main, and fork-gate.yml, on a fork's pull request.
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Read the listener's Go release
        id: go
        run: |
          version=$(sed -nE 's/^FROM[[:space:]]+(--[^[:space:]]+[[:space:]]+)*[^[:space:]]*golang:([0-9]+\.[0-9]+(\.[0-9]+)?)([-@[:space:]].*)?$/\2/p' cmd/listener/Dockerfile | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::cmd/listener/Dockerfile has no FROM golang:<release> line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The Go release comes from the golang tag in cmd/listener/Dockerfile,
      # read by the step above, so the gate tests with the release the image
      # builds with. Dependabot bumps only that tag, and this follows it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - run: npm ci --ignore-scripts
      - run: npm run gate

  # The image the deploy would build, built and thrown away: a broken
  # Dockerfile fails here, on the branch, rather than in the deploy after
  # merge. Native arm64, as the listener runs.
  image:
    name: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the listener's image
        run: docker build --file cmd/listener/Dockerfile --tag paddock-listener:gate .
      # As ECS runs it: the image's own user, the health check inside it.
      - name: Start the listener, and check it turns healthy
        run: |
          if docker run --rm paddock-listener:gate -healthcheck 2>"$RUNNER_TEMP/before.err"; then
            echo "::error::the health check passed before the listener ran"
            exit 1
          fi
          grep -q "no heartbeat" "$RUNNER_TEMP/before.err"
          docker run --detach --name listener paddock-listener:gate
          for _ in $(seq 1 20); do
            if docker exec listener /listener -healthcheck; then
              docker stop listener >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs listener
          echo "::error::the listener did not turn healthy in 20s"
          exit 1
