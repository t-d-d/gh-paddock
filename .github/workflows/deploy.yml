# gh-paddock's deploy, modelled on gh-governor's.
#
# Builds the listener's image and the runner's, and applies
# infra/paddock.cfn.yml: the stack that runs the listener on Fargate Spot,
# which starts the runner tasks. Only main deploys, after a green
# gate: a push to main, or a run by hand on main. The deploy role's trust
# pins refs/heads/main, so a run on any other branch cannot assume it.
#
# The deploy job does nothing until the AWS_DEPLOY_ROLE_ARN secret is set,
# so a fork's first merges run the gate alone. Its settings are repository
# variables and secrets, never values in this file. Anyone can read a public
# repo's run logs, and Actions masks only a secret's exact string, so the
# alert email never passes through GitHub: the stack reads it from Parameter
# Store, /paddock/alert-email. The role's ARN, the registry and the image URI
# all carry the AWS account id, so the role's ARN is a secret and the
# credentials step masks the account id in every later line
# (docs/constraints/public-repo.md).
#
#   AWS_DEPLOY_ROLE_ARN  secret: the role the job assumes through GitHub's
#                        OIDC, the bootstrap stack's output
#
# The stacks live in us-east-1, the CI account's region, which no variable
# moves (docs/constraints/region.md).
#
# The runner-build jobs build the runner's image for x64 and for arm64, each
# on a GitHub runner of that architecture, under a tag that hashes runner/.
# The runner-image job joins the two under one image index, converts it into
# one with a SOCI index for each architecture, and hands on that index's
# digest. The deploy job, in
# order: apply the bootstrap stack (infra/bootstrap.cfn.yml), derive the
# listener's image tag from the image's inputs, build only when that tag is
# new, join the runner's digest to the registry, read the default VPC, apply
# the main stack with both images, and probe the listener
# (scripts/probe.mjs): the service runs the new image and a task of it
# reports healthy, which it does only once GitHub has accepted the App key.
# A red probe is a red deploy. A failed apply of either stack, or of the
# rollback, prints the stack's failed events since it started
# (scripts/cfn-failed-events.mjs) to the log, then fails.
#
# Two layers roll back (docs/constraints/deploy.md). A new task that never
# turns healthy trips the service's circuit breaker: ECS returns to the last
# good task definition, the apply fails, and CloudFormation rolls the stack
# back itself. A red probe after a green apply rolls the stack back here:
# before the apply, the job reads both images the stack runs, and on a red
# probe that changed either it applies the same template again with both,
# changing nothing else, and probes again. The deploy stays red
# either way. A rollback that does not bring the listener back, because its
# apply or its probe failed, pages the operator through the stack's alerts
# topic: jobs on these runners then queue with nothing to start them. A
# probe-only run applies nothing, so it rolls nothing back.
#
# No secret is written here. The operator writes the GitHub App's key to the
# Parameter Store parameter /paddock/github-app once, as a SecureString,
# before the first deploy (docs/constraints/public-repo.md).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe_only:
        description: Skip the build and the apply; only probe the deployed listener.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Two applies at once would race on the stack and on the image tag, so they
# queue. GitHub keeps one pending run per group and cancels the older when
# another queues; a newer push carries the older commit, so that loses
# nothing. A probe-only run queues apart, so it never takes a push's place.
concurrency:
  group: ${{ inputs.probe_only && 'deploy-probe' || 'deploy' }}
  cancel-in-progress: false

# What governor reads of a deploy (.github/governor.json, deployMessages).
# The deploy job's name ends "at <commit> · deployed: paddock", so governor
# tells the session of each pull request a green deploy shipped, and of each
# one a red run on main failed to ship. `all` picks every pull request merged
# since the deploy before. The value is public: a step prints its env.
env:
  TICKET_LABEL_PATHS: all

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  # A job's `if:` cannot read a secret, so this job reads whether the role's
  # secret is set and hands the deploy job the answer.
  role:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      set: ${{ steps.read.outputs.set }}
    steps:
      - name: Read whether the deploy role's secret is set
        id: read
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -n "$ROLE_ARN" ]]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

  # The runner's image tag hashes runner/, whose Dockerfile copies nothing
  # from the repo; test/deploy-workflow.test.ts holds that. Planned once, so
  # each architecture's build and the index share it.
  runner-plan:
    needs: [gate, role]
    if: ${{ needs.role.outputs.set == 'true' && !inputs.probe_only }}
    name: Plan the runner's image tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan the image tag
        id: plan
        run: |
          set -o pipefail
          IMAGE_TAG=$(git ls-tree -r HEAD -- runner | git hash-object --stdin)
          if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = e69de29bb2d1d6434b8b29ae775ad8c2e48c5391 ]; then
            echo "::error::image tag hashed an empty file list."
            exit 1
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  # The runner's image for each architecture a pool can set, each built on a
  # GitHub runner of that architecture, never under emulation, under the
  # plan's tag with the architecture after it.
  runner-build:
    needs: [runner-plan]
    name: Build the runner's image for ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      id-token: write   # OIDC token for AWS assume-role
      contents: read    # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Resolve the runner's image
        id: image
        uses: ./.github/actions/image
        with:
          repo_name: paddock-runner
          image_tag: ${{ needs.runner-plan.outputs.image_tag }}-${{ matrix.arch }}
          dockerfile: runner/Dockerfile
          region: us-east-1
          platform: ${{ matrix.platform }}
          cache_scope: runner-${{ matrix.arch }}
          # Fargate lazy loads an image with a SOCI index, and reads one only
          # over gzip layers. Every layer is pushed as an OCI gzip layer, the
          # base's included, so every image soci converts is OCI.
          compression: gzip

  # Both architectures' images joined under one image index, at the plan's
  # tag, so the stack takes one image and the rollback is unchanged: ECS
  # pulls from the index the image of the task's own architecture. Its job
  # output is the index's digest alone: Actions drops an output that holds a
  # masked string, and the image URI carries the account id, which the
  # credentials step masks.
  #
  # The index at the plan's tag carries a SOCI index manifest v2 for each
  # architecture, so Fargate starts a cold runner task's container before the
  # whole image is down. The two images are first joined at the plan's tag
  # with -gzip after it, and `soci convert` turns that index into one with a
  # SOCI index bound to each image. Converting changes each image's digest,
  # and the registry's tags are immutable, so the plan's tag holds the
  # converted index alone.
  runner-image:
    needs: [runner-plan, runner-build]
    name: Join the runner's images under one index
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write   # OIDC token for AWS assume-role
      contents: read    # the workflow's own permissions, kept
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      # scripts/soci/, which the gate's soci job runs too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # soci converts the index and crane pushes it, each one release by
      # number checked against its sha256 before it is unpacked
      # (scripts/soci/install.sh). The job holds the deploy role, so an
      # unchecked binary would run with it.
      - name: Install soci and crane
        run: |
          scripts/soci/install.sh "${RUNNER_TEMP}/soci-tools"
          echo "${RUNNER_TEMP}/soci-tools" >> "$GITHUB_PATH"

      # The registry's tags are immutable, so an index already at a tag is
      # the one an earlier run pushed there, and is reused.
      - name: Join both architectures' images under the plan's tag
        id: index
        env:
          TAG: ${{ needs.runner-plan.outputs.image_tag }}
        run: |
          set -euo pipefail
          REPO=paddock-runner
          # The digest a tag names, or nothing when the tag is not there.
          # Any other error, such as AccessDenied, stops the job.
          digest_of() {
            local out
            if ! out=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$1" \
                --query 'imageDetails[0].imageDigest' --output text 2>"$RUNNER_TEMP/ecr.err"); then
              grep -q ImageNotFoundException "$RUNNER_TEMP/ecr.err" && return 0
              echo "::error::could not read ${REPO}:$1: $(cat "$RUNNER_TEMP/ecr.err")" >&2
              return 1
            fi
            [[ "$out" == None ]] || echo "$out"
          }
          # The bare tag's digest, media type and manifest, read in one call
          # into image.json. batch-get-image exits 0 when it cannot find a
          # tag and names the cause in its failures. Returns 1 when the tag is
          # not there; any other failure stops the job and says it could not
          # read the tag.
          IMAGE="${RUNNER_TEMP}/image.json"
          read_tag() {
            if ! aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" \
                --accepted-media-types application/vnd.oci.image.index.v1+json application/vnd.docker.distribution.manifest.list.v2+json \
                  application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.v2+json \
                --output json > "$IMAGE" 2>"$RUNNER_TEMP/ecr.err"; then
              echo "::error::could not read ${REPO}:${TAG}: $(cat "$RUNNER_TEMP/ecr.err")"
              exit 1
            fi
            jq -e '.images | length == 1' "$IMAGE" > /dev/null && return 0
            if jq -e '.images == [] and .failures[0].failureCode == "ImageNotFound"' "$IMAGE" > /dev/null; then
              return 1
            fi
            echo "::error::could not read ${REPO}:${TAG}: $(jq -c '.failures' "$IMAGE")"
            exit 1
          }
          if ! read_tag; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"
            GZIP=$(digest_of "${TAG}-gzip")
            if [[ -z "$GZIP" ]]; then
              X64=$(digest_of "${TAG}-x64")
              ARM64=$(digest_of "${TAG}-arm64")
              for digest in "$X64" "$ARM64"; do
                if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error::an architecture's image is missing for ${TAG}"
                  exit 1
                fi
              done
              aws ecr get-login-password --region us-east-1 \
                | docker login --username AWS --password-stdin "$REGISTRY"
              docker buildx imagetools create --tag "${REGISTRY}/${REPO}:${TAG}-gzip" \
                "${REGISTRY}/${REPO}@${X64}" "${REGISTRY}/${REPO}@${ARM64}"
              GZIP=$(digest_of "${TAG}-gzip")
            fi
            if [[ ! "$GZIP" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no index at ${REPO}:${TAG}-gzip"
              exit 1
            fi
            # The same script the gate's soci job runs on every pull request,
            # against a registry of its own.
            export REGISTRY_AUTH_FILE="${RUNNER_TEMP}/auth.json"
            aws ecr get-login-password --region us-east-1 \
              | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username AWS --password-stdin "$REGISTRY"
            aws ecr get-login-password --region us-east-1 \
              | crane auth login "$REGISTRY" --username AWS --password-stdin
            scripts/soci/convert-and-push.sh "${REGISTRY}/${REPO}@${GZIP}" "${REGISTRY}/${REPO}:${TAG}" "$RUNNER_TEMP"
            if ! read_tag; then
              echo "::error::could not read ${REPO}:${TAG}: it is not there after the push"
              exit 1
            fi
          fi
          DIGEST=$(jq -r '.images[0].imageId.imageDigest' "$IMAGE")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no index at ${REPO}:${TAG}"
            exit 1
          fi
          # Before both architectures, the deploy pushed a single x64 image
          # at the bare tag. A tag holding one of those is refused, not
          # handed on: an arm64 pool's tasks would pull an x64 image.
          MEDIA=$(jq -r '.images[0].imageManifestMediaType' "$IMAGE")
          case "$MEDIA" in
            application/vnd.oci.image.index.v1+json | application/vnd.docker.distribution.manifest.list.v2+json) ;;
            *)
              echo "::error::${REPO}:${TAG} holds a single image (${MEDIA}), not an index of both architectures"
              exit 1
              ;;
          esac
          # Fargate starts a task from an index with no SOCI index all the
          # same, pulling the whole image first, so nothing later would
          # notice one missing. Each architecture's image must be there with
          # a SOCI index manifest v2 of the same architecture beside it.
          jq -r '.images[0].imageManifest' "$IMAGE" > "${RUNNER_TEMP}/index.json"
          if ! jq -e -f scripts/soci/check-index.jq "${RUNNER_TEMP}/index.json" > /dev/null; then
            echo "::error::${REPO}:${TAG} has no SOCI index manifest v2 for each architecture"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [gate, role, runner-image]
    # A probe-only run skips the runner's image and still probes.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.role.outputs.set == 'true' && (inputs.probe_only || needs.runner-image.result == 'success') }}
    # A probe-only run deploys nothing, so its name carries no marker. A
    # rollback is a step of this job, and the job then ends red.
    name: "${{ inputs.probe_only && 'Probe only: probe the listener' || format('Build the image, apply the stacks, probe the listener at {0} · deployed: paddock', github.sha) }}"
    # Native arm64: the listener runs on arm64.
    runs-on: ubuntu-24.04-arm
    # Room for a rollback's apply and second probe after the first, inside
    # the deploy role's one-hour session.
    timeout-minutes: 55
    permissions:
      id-token: write   # OIDC token for AWS assume-role
      contents: read    # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          # Every later line masks the account id: the registry and the
          # image URI carry it.
          mask-aws-account-id: true

      # The probe and the rollback guard read AWS through the SDK.
      - name: Install the deploy's scripts' dependencies
        run: npm ci --ignore-scripts

      # The bootstrap stack is applied before the main stack's guard runs, so
      # it has a guard of its own.
      - name: Continue a stalled rollback of the bootstrap stack, if it is in one
        if: ${{ !inputs.probe_only }}
        run: node scripts/cfn-continue-stalled-rollback.mjs paddock-bootstrap

      # The role this job holds. The operator applies the stack once by
      # hand; from then on each deploy applies it, naming the repo and its
      # ids from the run, which is what the role's trust pins.
      - name: Apply the bootstrap stack
        id: bootstrap
        if: ${{ !inputs.probe_only }}
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          REPO: ${{ github.event.repository.name }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          aws cloudformation deploy \
            --stack-name paddock-bootstrap \
            --template-file infra/bootstrap.cfn.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "GitHubOwner=${OWNER}" \
              "GitHubOwnerId=${OWNER_ID}" \
              "GitHubRepo=${REPO}" \
              "GitHubRepoId=${REPO_ID}" \
            || { status=$?; node scripts/cfn-failed-events.mjs paddock-bootstrap "$SINCE"; exit "$status"; }

      - name: Plan the image tag
        id: plan
        if: ${{ !inputs.probe_only }}
        # Content-hashed from exactly what the Dockerfile copies;
        # test/deploy-workflow.test.ts holds the two lists together.
        run: |
          set -o pipefail
          IMAGE_TAG=$(git ls-tree -r HEAD -- go.mod go.sum cmd internal cmd/listener/Dockerfile \
              | git hash-object --stdin)
          if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = e69de29bb2d1d6434b8b29ae775ad8c2e48c5391 ]; then
            echo "::error::image tag hashed an empty file list."
            exit 1
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve the listener's image
        id: image
        if: ${{ !inputs.probe_only }}
        uses: ./.github/actions/image
        with:
          repo_name: paddock-listener
          image_tag: ${{ steps.plan.outputs.image_tag }}
          dockerfile: cmd/listener/Dockerfile
          region: us-east-1
          cache_scope: listener

      # The runner-image job hands on the digest; the registry is this
      # account's, in the stacks' region.
      - name: Join the runner's digest to the registry
        id: runner
        if: ${{ !inputs.probe_only }}
        env:
          DIGEST: ${{ needs.runner-image.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the runner-image job handed on no digest"
            exit 1
          fi
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "image_uri=${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/paddock-runner@${DIGEST}" >> "$GITHUB_OUTPUT"

      # The listener runs in the default VPC's subnets: public, with an
      # internet gateway and no NAT to pay for. An account without a default
      # VPC gets one back with `aws ec2 create-default-vpc` (admin, once).
      - name: Read the default VPC
        id: network
        if: ${{ !inputs.probe_only }}
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=is-default,Values=true \
            --query 'Vpcs[0].VpcId' --output text)
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters Name=default-for-az,Values=true \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          if [[ -z "$VPC_ID" || "$VPC_ID" == None || -z "$SUBNET_IDS" ]]; then
            echo "::error::no default VPC in this region; the listener has nowhere to run"
            exit 1
          fi
          echo "vpc_id=${VPC_ID}" >> "$GITHUB_OUTPUT"
          echo "subnet_ids=${SUBNET_IDS}" >> "$GITHUB_OUTPUT"

      # ECS creates this role on an account's first cluster, and a cluster
      # with capacity providers can fail to attach them while it does. That
      # failed first create leaves a stack only a delete clears.
      - name: Make sure ECS's service-linked role exists
        id: ecs-role
        if: ${{ !inputs.probe_only }}
        run: |
          aws iam get-role --role-name AWSServiceRoleForECS >/dev/null 2>&1 \
            || aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com >/dev/null

      # A stack in UPDATE_ROLLBACK_FAILED cannot be updated, and clearing it
      # would otherwise need admin credentials on a laptop.
      - name: Continue a stalled rollback, if the stack is in one
        if: ${{ !inputs.probe_only }}
        run: node scripts/cfn-continue-stalled-rollback.mjs paddock

      # The images a red probe rolls back to. A stack that does not exist yet
      # runs no image, so a red probe on its first apply has nothing to roll
      # back to; any other error stops the deploy before it changes anything.
      # A stack from before the runner's image has no runner image to read.
      - name: Read the images the stack runs now
        id: previous
        if: ${{ !inputs.probe_only }}
        run: |
          # stderr apart from the value, so a warning never becomes the image.
          read_parameter() {
            local value
            if ! value=$(aws cloudformation describe-stacks --stack-name paddock \
                --query "Stacks[0].Parameters[?ParameterKey=='$1'].ParameterValue" --output text 2>"$RUNNER_TEMP/previous.err"); then
              if ! grep -q "does not exist" "$RUNNER_TEMP/previous.err"; then
                echo "::error::could not read the image the stack runs: $(cat "$RUNNER_TEMP/previous.err")" >&2
                return 1
              fi
              value=""
            fi
            [[ "$value" == None ]] && value=""
            echo "$value"
          }
          PREVIOUS=$(read_parameter ImageUri)
          PREVIOUS_RUNNER=$(read_parameter RunnerImageUri)
          if [[ -z "$PREVIOUS" ]]; then
            echo "::notice::the stack runs no image yet, so a red probe has nothing to roll back to"
          else
            echo "the stack runs ${PREVIOUS##*@}, and the runner ${PREVIOUS_RUNNER##*@}; a red probe rolls back to them"
          fi
          echo "image_uri=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "runner_image_uri=${PREVIOUS_RUNNER}" >> "$GITHUB_OUTPUT"

      - name: Apply the stack
        id: apply
        if: ${{ !inputs.probe_only }}
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          RUNNER_IMAGE_URI: ${{ steps.runner.outputs.image_uri }}
          VPC_ID: ${{ steps.network.outputs.vpc_id }}
          SUBNET_IDS: ${{ steps.network.outputs.subnet_ids }}
        run: |
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          aws cloudformation deploy \
            --stack-name paddock \
            --template-file infra/paddock.cfn.yml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${IMAGE_URI}" \
              "RunnerImageUri=${RUNNER_IMAGE_URI}" \
              "VpcId=${VPC_ID}" \
              "SubnetIds=${SUBNET_IDS}" \
            || { status=$?; node scripts/cfn-failed-events.mjs paddock "$SINCE"; exit "$status"; }

      # Exits 0 once the service runs the image just applied and a task of it
      # reports healthy; on a probe-only run, the image the stack runs.
      - name: Probe the listener
        id: probe
        env:
          EXPECTED_IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: node scripts/probe.mjs

      # Every step from here runs only after a red probe. `aws cloudformation
      # deploy` keeps every parameter it is not given, so the two images are
      # the one thing the rollback changes. A stack from before the runner's
      # image ran none, so the rollback keeps the one just built.
      - name: Roll the stack back to the images it ran before this deploy
        id: rollback
        if: ${{ failure() && !inputs.probe_only && steps.probe.outcome == 'failure' && steps.previous.outputs.image_uri != '' && (steps.previous.outputs.image_uri != steps.image.outputs.image_uri || (steps.previous.outputs.runner_image_uri != '' && steps.previous.outputs.runner_image_uri != steps.runner.outputs.image_uri)) }}
        env:
          PREVIOUS_IMAGE_URI: ${{ steps.previous.outputs.image_uri }}
          PREVIOUS_RUNNER_IMAGE_URI: ${{ steps.previous.outputs.runner_image_uri }}
          RUNNER_IMAGE_URI: ${{ steps.runner.outputs.image_uri }}
        run: |
          ROLLBACK_RUNNER_IMAGE_URI="${PREVIOUS_RUNNER_IMAGE_URI:-$RUNNER_IMAGE_URI}"
          echo "::error::the probe failed; rolling the stack back to ${PREVIOUS_IMAGE_URI##*@}, and the runner to ${ROLLBACK_RUNNER_IMAGE_URI##*@}, the images it ran before this deploy"
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          aws cloudformation deploy \
            --stack-name paddock \
            --template-file infra/paddock.cfn.yml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${PREVIOUS_IMAGE_URI}" \
              "RunnerImageUri=${ROLLBACK_RUNNER_IMAGE_URI}" \
            || { status=$?; node scripts/cfn-failed-events.mjs paddock "$SINCE"; exit "$status"; }

      - name: Probe the listener on the image it rolled back to
        id: reprobe
        if: ${{ failure() && steps.rollback.outcome == 'success' }}
        env:
          EXPECTED_IMAGE_URI: ${{ steps.previous.outputs.image_uri }}
        run: |
          node scripts/probe.mjs
          echo "::notice::rolled the stack back to ${EXPECTED_IMAGE_URI##*@}, and its probe passed. The deploy stays red: this commit's image failed its probe."

      # The deploy's red run reaches whoever watches Actions; the listener
      # down reaches the operator, through the topic every alarm publishes to.
      # A job that reaches its timeout is cancelled rather than failed, and
      # the listener's state is then unknown, so a cancelled rollback or
      # re-probe pages too.
      - name: Page the operator, since the rollback did not bring the listener back
        id: page
        if: ${{ (failure() || cancelled()) && (steps.rollback.outcome == 'failure' || steps.rollback.outcome == 'cancelled' || steps.reprobe.outcome == 'failure' || steps.reprobe.outcome == 'cancelled') }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error::the rollback did not bring the listener back. Paging the operator."
          TOPIC_ARN=$(aws cloudformation describe-stack-resource --stack-name paddock --logical-resource-id AlertsTopic \
            --query StackResourceDetail.PhysicalResourceId --output text)
          aws sns publish --topic-arn "$TOPIC_ARN" \
            --subject "[paddock] A deploy's probe failed, and so did its rollback" \
            --message "The listener may be down, and jobs on gh-paddock's runners then queue with nothing to start them. The deploy at ${GITHUB_SHA} failed its probe, and rolling the stack back to the image it ran before did not bring the listener back: the rollback's apply or its probe failed. Read the run: ${RUN_URL}" \
            > /dev/null
