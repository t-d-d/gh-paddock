# gh-paddock's deploy, modelled on gh-governor's.
#
# Builds the listener's image and applies infra/paddock.cfn.yml: the stack
# that runs the listener on Fargate Spot. A green gate on a push to main
# deploys; nothing else does.
#
# The deploy job does nothing until the AWS_DEPLOY_ROLE_ARN secret is set,
# so a fork's first merges run the gate alone. Its settings are repository
# variables and secrets, never values in this file. Anyone can read a public
# repo's run logs, and Actions masks only a secret's exact string, so the
# alert email never passes through GitHub: the stack reads it from Parameter
# Store, /paddock/alert-email. The role's ARN, the registry and the image URI
# all carry the AWS account id, so the role's ARN is a secret and the
# credentials step masks the account id in every later line
# (docs/constraints/public-repo.md).
#
#   AWS_DEPLOY_ROLE_ARN  secret: the role the job assumes through GitHub's
#                        OIDC, the bootstrap stack's output
#   AWS_REGION           variable: where the stacks live (default us-east-1)
#
# The deploy job, in order: apply the bootstrap stack (infra/bootstrap.cfn.yml),
# derive the image tag from the image's inputs, build only when that tag is
# new, read the default VPC, apply the main stack, and probe the listener
# (scripts/probe.mjs): the service runs the new image and a task of it
# reports healthy. A red probe is a red deploy.
#
# Two layers roll back (docs/constraints/deploy.md). A new task that never
# turns healthy trips the service's circuit breaker: ECS returns to the last
# good task definition, the apply fails, and CloudFormation rolls the stack
# back itself. A red probe after a green apply rolls the stack back here:
# before the apply, the job reads the image the stack runs, and on a red
# probe that changed the image it applies the same template again with that
# image, changing nothing else, and probes again. The deploy stays red
# either way. A rollback that does not bring the listener back, because its
# apply or its probe failed, pages the operator through the stack's alerts
# topic: jobs on these runners then queue with nothing to start them. A
# probe-only run applies nothing, so it rolls nothing back.
#
# No secret is written here. The operator saves the GitHub App's key into
# the bootstrap stack's secret once, before the first deploy.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe_only:
        description: Skip the build and the apply; only probe the deployed listener.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Two applies at once would race on the stack and on the image tag; queue.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  # A job's `if:` cannot read a secret, so this job reads whether the role's
  # secret is set and hands the deploy job the answer.
  role:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      set: ${{ steps.read.outputs.set }}
    steps:
      - name: Read whether the deploy role's secret is set
        id: read
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -n "$ROLE_ARN" ]]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [gate, role]
    if: ${{ needs.role.outputs.set == 'true' }}
    name: "${{ inputs.probe_only && 'Probe only: probe the listener' || 'Build the image, apply the stacks, probe the listener' }}"
    # Native arm64: the listener runs on arm64.
    runs-on: ubuntu-24.04-arm
    # Room for a rollback's apply and second probe after the first, inside
    # the deploy role's one-hour session.
    timeout-minutes: 55
    permissions:
      id-token: write   # OIDC token for AWS assume-role
      contents: read    # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          # Every later line masks the account id: the registry and the
          # image URI carry it.
          mask-aws-account-id: true

      # The probe and the rollback guard read AWS through the SDK.
      - name: Install the deploy's scripts' dependencies
        run: npm ci --ignore-scripts

      # The bootstrap stack is applied before the main stack's guard runs, so
      # it has a guard of its own.
      - name: Continue a stalled rollback of the bootstrap stack, if it is in one
        if: ${{ !inputs.probe_only }}
        run: node scripts/cfn-continue-stalled-rollback.mjs paddock-bootstrap

      # The role this job holds, and the secret the operator writes. The
      # operator applies the stack once by hand; from then on each deploy
      # applies it, naming the repo and its ids from the run, which is what
      # the role's trust pins.
      - name: Apply the bootstrap stack
        id: bootstrap
        if: ${{ !inputs.probe_only }}
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          REPO: ${{ github.event.repository.name }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          aws cloudformation deploy \
            --stack-name paddock-bootstrap \
            --template-file infra/bootstrap.cfn.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "GitHubOwner=${OWNER}" \
              "GitHubOwnerId=${OWNER_ID}" \
              "GitHubRepo=${REPO}" \
              "GitHubRepoId=${REPO_ID}"

      - name: Plan the image tag
        id: plan
        if: ${{ !inputs.probe_only }}
        # Content-hashed from exactly what the Dockerfile copies;
        # test/deploy-workflow.test.ts holds the two lists together.
        run: |
          set -o pipefail
          IMAGE_TAG=$(git ls-tree -r HEAD -- go.mod cmd internal cmd/listener/Dockerfile \
              | git hash-object --stdin)
          if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = e69de29bb2d1d6434b8b29ae775ad8c2e48c5391 ]; then
            echo "::error::image tag hashed an empty file list."
            exit 1
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve the listener's image
        id: image
        if: ${{ !inputs.probe_only }}
        uses: ./.github/actions/image
        with:
          repo_name: paddock-listener
          image_tag: ${{ steps.plan.outputs.image_tag }}
          dockerfile: cmd/listener/Dockerfile
          region: ${{ vars.AWS_REGION || 'us-east-1' }}
          cache_scope: listener

      # The listener runs in the default VPC's subnets: public, with an
      # internet gateway and no NAT to pay for. An account without a default
      # VPC gets one back with `aws ec2 create-default-vpc` (admin, once).
      - name: Read the default VPC
        id: network
        if: ${{ !inputs.probe_only }}
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=is-default,Values=true \
            --query 'Vpcs[0].VpcId' --output text)
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters Name=default-for-az,Values=true \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          if [[ -z "$VPC_ID" || "$VPC_ID" == None || -z "$SUBNET_IDS" ]]; then
            echo "::error::no default VPC in this region; the listener has nowhere to run"
            exit 1
          fi
          echo "vpc_id=${VPC_ID}" >> "$GITHUB_OUTPUT"
          echo "subnet_ids=${SUBNET_IDS}" >> "$GITHUB_OUTPUT"

      # A stack in UPDATE_ROLLBACK_FAILED cannot be updated, and clearing it
      # would otherwise need admin credentials on a laptop.
      - name: Continue a stalled rollback, if the stack is in one
        if: ${{ !inputs.probe_only }}
        run: node scripts/cfn-continue-stalled-rollback.mjs paddock

      # The image a red probe rolls back to. A stack that does not exist yet
      # runs no image, so a red probe on its first apply has nothing to roll
      # back to; any other error stops the deploy before it changes anything.
      - name: Read the image the stack runs now
        id: previous
        if: ${{ !inputs.probe_only }}
        run: |
          # stderr apart from the value, so a warning never becomes the image.
          if ! PREVIOUS=$(aws cloudformation describe-stacks --stack-name paddock \
              --query "Stacks[0].Parameters[?ParameterKey=='ImageUri'].ParameterValue" --output text 2>"$RUNNER_TEMP/previous.err"); then
            if ! grep -q "does not exist" "$RUNNER_TEMP/previous.err"; then
              echo "::error::could not read the image the stack runs: $(cat "$RUNNER_TEMP/previous.err")"
              exit 1
            fi
            PREVIOUS=""
          fi
          if [[ -z "$PREVIOUS" || "$PREVIOUS" == None ]]; then
            echo "::notice::the stack runs no image yet, so a red probe has nothing to roll back to"
            PREVIOUS=""
          else
            echo "the stack runs ${PREVIOUS##*@}; a red probe rolls back to it"
          fi
          echo "image_uri=${PREVIOUS}" >> "$GITHUB_OUTPUT"

      - name: Apply the stack
        id: apply
        if: ${{ !inputs.probe_only }}
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          VPC_ID: ${{ steps.network.outputs.vpc_id }}
          SUBNET_IDS: ${{ steps.network.outputs.subnet_ids }}
        run: |
          aws cloudformation deploy \
            --stack-name paddock \
            --template-file infra/paddock.cfn.yml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${IMAGE_URI}" \
              "VpcId=${VPC_ID}" \
              "SubnetIds=${SUBNET_IDS}"

      # Exits 0 once the service runs the image just applied and a task of it
      # reports healthy; on a probe-only run, the image the stack runs.
      - name: Probe the listener
        id: probe
        env:
          EXPECTED_IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: node scripts/probe.mjs

      # Every step from here runs only after a red probe. `aws cloudformation
      # deploy` keeps every parameter it is not given, so the image is the
      # one thing the rollback changes.
      - name: Roll the stack back to the image it ran before this deploy
        id: rollback
        if: ${{ failure() && !inputs.probe_only && steps.probe.outcome == 'failure' && steps.previous.outputs.image_uri != '' && steps.previous.outputs.image_uri != steps.image.outputs.image_uri }}
        env:
          PREVIOUS_IMAGE_URI: ${{ steps.previous.outputs.image_uri }}
        run: |
          echo "::error::the probe failed; rolling the stack back to ${PREVIOUS_IMAGE_URI##*@}, the image it ran before this deploy"
          aws cloudformation deploy \
            --stack-name paddock \
            --template-file infra/paddock.cfn.yml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${PREVIOUS_IMAGE_URI}"

      - name: Probe the listener on the image it rolled back to
        id: reprobe
        if: ${{ failure() && steps.rollback.outcome == 'success' }}
        env:
          EXPECTED_IMAGE_URI: ${{ steps.previous.outputs.image_uri }}
        run: |
          node scripts/probe.mjs
          echo "::notice::rolled the stack back to ${EXPECTED_IMAGE_URI##*@}, and its probe passed. The deploy stays red: this commit's image failed its probe."

      # The deploy's red run reaches whoever watches Actions; the listener
      # down reaches the operator, through the topic every alarm publishes to.
      - name: Page the operator, since the rollback did not bring the listener back
        id: page
        if: ${{ failure() && (steps.rollback.outcome == 'failure' || steps.reprobe.outcome == 'failure') }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error::the rollback did not bring the listener back. Paging the operator."
          TOPIC_ARN=$(aws cloudformation describe-stack-resource --stack-name paddock --logical-resource-id AlertsTopic \
            --query StackResourceDetail.PhysicalResourceId --output text)
          aws sns publish --topic-arn "$TOPIC_ARN" \
            --subject "[paddock] A deploy's probe failed, and so did its rollback" \
            --message "The listener may be down, and jobs on gh-paddock's runners then queue with nothing to start them. The deploy at ${GITHUB_SHA} failed its probe, and rolling the stack back to the image it ran before did not bring the listener back: the rollback's apply or its probe failed. Read the run: ${RUN_URL}" \
            > /dev/null
