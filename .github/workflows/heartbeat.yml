# Checks governor's heartbeat issue every hour, and keeps an issue open,
# labelled `heartbeat`, while pickup's sweep has stopped firing or the
# heartbeat cannot be read. Governor cannot report that it has stopped, so
# the check runs here.
#
# It runs on this repo's own token, which may read the repo and write
# issues, and holds no secret. It is pinned to a commit of gh-governor,
# which publishes no tags, and passes the same commit as `commit`. Move it
# together with config-check.yml and governor.json's `$schema`
# (test/governor-config.test.ts).
#
# This repo is public, so the job runs on GitHub's runners, never on the
# runners it deploys (docs/constraints/public-repo.md).
name: heartbeat

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    uses: t-d-d/gh-governor/.github/workflows/heartbeat-check.yml@c6cf0d8fa15b77e3ef86802c805fe82c7d698d8d
    with:
      commit: c6cf0d8fa15b77e3ef86802c805fe82c7d698d8d
      tolerance-hours: 3
      labels: heartbeat
