# The gate for a fork's pull request, which has no push run here.
#
# A branch pushed to this repo is gated by gate.yml's push run, so this job
# skips its pull request. Its check is named `fork`, not `gate`: a skipped
# job reports success, and a skipped `gate` beside the push run's would read
# as green before the push run's gate finished. On a fork's pull request the
# checks are `fork / gate` and `fork / image`.
#
# pull_request, never pull_request_target: a fork's run gets a read-only
# token and no secrets. Its jobs run on GitHub's runners, never on the ones
# this repo deploys (docs/constraints/public-repo.md).
name: fork gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  fork:
    name: fork
    if: github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/gate.yml
